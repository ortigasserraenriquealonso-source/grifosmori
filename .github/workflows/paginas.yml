name: Publicar el sitio

# Cada push a main publica. Incluye los commits del robot de precios, así que
# una lectura nueva de Facilito llega sola a la web sin que nadie intervenga.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Lo invoca precios.yml después de escribir una lectura nueva. Hace falta
  # porque GitHub NO dispara workflows con los push que hace un workflow: es una
  # protección contra bucles infinitos. Sin esto, el robot actualizaría el
  # precio en el repositorio y la web nunca lo mostraría — y nada saldría en
  # rojo, que es lo que lo hace peligroso.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# Si entran dos publicaciones juntas, gana la última y la anterior se cancela:
# publicar una versión vieja encima de una nueva sería peor que perder tiempo.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # Solo sitio/: el scraper, el histórico y el README no se publican.
          path: sitio
      - id: deploy
        uses: actions/deploy-pages@v4

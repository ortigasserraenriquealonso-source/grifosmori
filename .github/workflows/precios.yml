name: Actualizar precios de combustible

on:
  schedule:
    # Cada hora, de 8:00 a 21:00 de Lima (Lima es UTC-5).
    #
    # Antes eran tres lecturas al día (10:00, 14:00 y 18:00). No alcanzó: el
    # cron de GitHub no es un reloj, es una cola de baja prioridad, y en un
    # repositorio público gratuito llegaba con ~3 h 30 de retraso o no llegaba
    # del todo. El 05/10/2026 no corrió NINGUNA de las tres y la web mostró el
    # precio del día anterior durante 19 horas, sin ponerse en rojo: una
    # lectura retrasada se ve igual que una lectura puntual.
    #
    # La frecuencia no es para leer más: el precio cambia una o dos veces por
    # semana. Es redundancia — si GitHub descarta una corrida, la siguiente
    # entra en una hora y no al día siguiente.
    #
    # El minuto 23 es deliberado: el minuto 0 es el más congestionado de la
    # cola de GitHub y es justo donde se acumulaba el retraso.
    - cron: "23 13-23 * * *"
    - cron: "23 0-2 * * *"
  workflow_dispatch:      # botón para forzar una actualización a mano

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Leer Facilito
        # Sin dependencias: el scraper usa solo la librería estándar.
        # Si Facilito falla, el paso sale en rojo y GitHub avisa por correo.
        run: python3 scraper/facilito.py

      - name: Publicar si cambió
        run: |
          # Se publica SIEMPRE, aunque el precio no haya cambiado: la marca de
          # tiempo es lo que mantiene viva la web. Si no se subiera, a las 48 h
          # la página escondería precios que en realidad siguen vigentes.
          # Son unas 1 100 publicaciones al año, cada una de pocos cientos de
          # bytes; el mensaje del commit dice si el precio cambió o no.
          if [ -z "$(git status --porcelain sitio/precios.json datos/historico.jsonl)" ]; then
            echo "Nada que publicar (el scraper no escribió)."
            exit 0
          fi
          if grep -q '"cambio_en_esta_lectura": true' sitio/precios.json; then
            ETIQUETA="precio nuevo"
          else
            ETIQUETA="sin cambio"
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitio/precios.json datos/historico.jsonl
          git commit -m "precios ($ETIQUETA): $(TZ=America/Lima date '+%d/%m/%Y %H:%M') Lima"
          git push || { git pull --rebase && git push; }

  # Publicar el sitio con la lectura nueva. Se invoca el workflow de publicación
  # en vez de confiar en que el push de arriba lo dispare, porque no lo hace.
  publicar:
    needs: actualizar
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/paginas.yml
